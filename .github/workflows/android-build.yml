name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle Wrapper
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Force clean everything
      run: |
        ./gradlew clean
        rm -rf app/build
        rm -rf .gradle
        rm -rf ~/.gradle/caches/
        rm -rf ~/.gradle/wrapper/
        rm -rf app/build/tmp/
        rm -rf app/build/generated/
        rm -rf app/build/intermediates/
        rm -rf app/build/outputs/
        find . -name "*.class" -type f -delete
        find . -name "*.dex" -type f -delete
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-build-cache --rerun-tasks
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurvey-Android-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Build Success
      if: success()
      run: echo "✅ APK构建成功！"
    
    - name: Build Failure
      if: failure()
      run: echo "❌ APK构建失败！"
